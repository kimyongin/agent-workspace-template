# 웹(정적 빌드)을 GitHub Pages에 배포한다. 운영 배포이므로 사람이 지시할 때만 수동으로 실행한다(ADR-0008).
# 공개 값만 쓴다: Supabase 주소·publishable key·API 주소는 저장소 Actions 변수(vars)에 둔다. 비밀값은 쓰지 않는다.
# 개발용 로그인(VITE_DEV_LOGIN)은 설정하지 않으므로 운영 빌드에 나타나지 않는다.
name: pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 배포할 revision(검증된 main의 커밋 또는 브랜치)
        required: true
        default: main

# 기본은 읽기만. 배포 권한은 deploy job에만 준다(빌드는 npm 의존성 코드를 실행하므로).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: main에 머지된 revision만 배포
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "main에 머지되지 않은 revision은 배포하지 않습니다"; exit 1; }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 웹 빌드
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PROD_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ vars.PROD_API_URL }}
          VITE_REPOSITORY_URL: ${{ vars.PROD_REPOSITORY_URL }}
      - name: 운영 빌드가 로컬 Supabase를 가리키지 않는지 확인
        # 개발용 로그인 코드 자체를 번들에서 빼는 일은 T02-6의 운영 빌드 검사에서 한다(지금은 표시만 막힘).
        run: |
          for v in "${{ vars.PROD_SUPABASE_URL }}" "${{ vars.PROD_SUPABASE_PUBLISHABLE_KEY }}" "${{ vars.PROD_API_URL }}"; do
            if [ -z "$v" ]; then echo "PROD_* Actions 변수가 비어 있습니다"; exit 1; fi
          done
          # 로컬 Supabase(포트 554xx)를 가리키면 실패. supabase-js는 허용 호스트 목록에 127.0.0.1을 원래 담고 있으므로 포트까지 본다.
          if grep -rqE "(127\.0\.0\.1|localhost):554[0-9]{2}" dist/; then echo "빌드가 로컬 Supabase 주소를 담고 있습니다"; exit 1; fi
      # configure-pages는 쓰지 않는다: 웹 경로는 VITE_BASE로 정하고, 빌드 job은 Pages 읽기 권한도 갖지 않는다.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
