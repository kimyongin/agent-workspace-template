# 최소 CI: 문서 검사, 공백 검사, 서버(Deno) 검사·core 테스트, 웹 타입 검사·빌드, 격리 로컬 DB 테스트.
# 운영 secret을 쓰지 않는다. job 이름을 바꾸면 main 보호의 필수 검사 설정도 함께 바꾼다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 문서 검사
        run: node scripts/check-docs.mjs && node --test "scripts/*.test.mjs"
      - name: 공백 검사
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check "${{ github.event.before }}" HEAD 2>/dev/null || git diff --check HEAD~1 HEAD
          fi
      - run: npm ci
      - name: 서버 검사(Deno)
        run: npm run check:deno
      - name: core 테스트
        run: npm run test:core
      - name: 웹 테스트
        run: npm run test:web
      - name: 웹 빌드
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 로컬 Supabase 준비(러너 안의 격리 DB)
        run: npm run setup:local
      - name: DB 테스트
        run: npm run test:db
      - name: Edge Functions 실행
        run: |
          npm run serve:functions > functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:55421/functions/v1/api/tasks || true)
            [ "$code" = "401" ] && exit 0
            sleep 2
          done
          cat functions.log; exit 1
      - name: HTTP 계약 테스트
        run: npm run test:http
      - name: 실패 시 함수 로그
        if: failure()
        run: cat functions.log || true
