# Actions 잔량 보호를 위해 테스트는 당분간 로컬에서만 실행한다.
# CI에는 정적 검사와 빌드만 남기며 main의 필수 상태는 check다.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 변경 영향 분류(PR merge-base→head / push before→after)
        id: impact
        run: node scripts/ci-impact.mjs
      - name: 문서 검사
        run: node scripts/check-docs.mjs
      - name: 공백 검사
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            git diff --check "${{ github.event.before }}" "${{ github.event.after }}"
          else
            git show --format= --check HEAD
          fi
      - name: 의존 경계 검사
        if: steps.impact.outputs.mode != 'docs'
        run: npm run check:boundaries
      - name: 서버 검사(Deno)
        if: steps.impact.outputs.mode == 'full'
        run: npm run check:deno
      - name: 웹 빌드
        if: steps.impact.outputs.mode != 'docs'
        run: npm run build
